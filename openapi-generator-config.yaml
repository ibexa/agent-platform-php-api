generatorName: php
inputSpec: /spec/openapi.json
outputDir: /local/src
skipValidateSpec: true

openapiNormalizer:
  FILTER: "tag:public"

globalProperties:
  models: ""
  modelDocs: false
  modelTests: false
  apis: ""
  apiDocs: false
  apiTests: false
  supportingFiles: ""
  skipFormModel: false

additionalProperties:
  # The upstream PHP generator requires a library selection; api.mustache
  # overrides its Guzzle transport with Symfony HttpClient.
  library: guzzle
  srcBasePath: lib
  composerPackageName: ibexa/agent-platform-api
  apiPackage: Client
  modelPackage: Model
  invokerPackage: Ibexa\AgentPlatform
  removeOperationIdPrefix: true
  removeOperationIdPrefixDelimiter: "-"
